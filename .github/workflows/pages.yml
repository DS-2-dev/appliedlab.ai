# Publishes the-lab/ to GitHub Pages on every push to main: The Lab's public
# site, saved from its Worker by scripts/snapshot-the-lab.py. The old site's
# build (npm run build:pages, out/) is no longer served. The custom domain is
# set once in the repo's Settings > Pages and survives each deploy.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: the-lab

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
