# Publishes The Lab's public site to GitHub Pages. On every push to main and
# about every 15 minutes, it saves the public pages fresh from the Worker with
# scripts/snapshot-the-lab.py, so what Admins publish (site copy, meetings,
# stories) reaches appliedlab.ai by itself. If the pages can't be saved, the run
# fails and the last good site stays up. It only reads public pages.
#
# A stopgap: turn this workflow off once appliedlab.ai's DNS points at the
# Worker. The custom domain is set once in the repo's Settings > Pages and
# survives each deploy.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check the 600-line file limit
        run: python3 -I scripts/check-file-lengths.py
      - name: Test snapshot redirect policy
        run: python3 -I scripts/test_snapshot_redirects.py
      - name: Save the public pages from the platform
        run: python3 -I scripts/snapshot-the-lab.py "$RUNNER_TEMP/the-lab"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/the-lab
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
