# Builds the static site (npm run build:pages) and publishes out/ to GitHub
# Pages on every push to main. The custom domain is set once in the repo's
# Settings > Pages and survives each deploy.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          # The Ask the Lab Worker (worker/README.md). The repo variable
          # ASK_URL overrides the deployed address.
          NEXT_PUBLIC_ASK_URL: ${{ vars.ASK_URL || 'https://appliedlab-ask.now-playing.workers.dev' }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
